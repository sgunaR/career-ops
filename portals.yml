# -- Company aliases (optional) --
# Map alternate company names to a single canonical label so the scanner's
# company+role dedup matches your tracker. The scanner keys dedup on the name a
# provider returns — usually the ATS org (e.g. Greenhouse "Intercom") — which
# may differ from the brand you track (e.g. "Fin"). Without an alias, the same
# role is re-scanned and re-evaluated every run because "intercom::role" never
# matches "fin::role" in data/applications.md.
#
# Format: `CanonicalName: [alias, ...]`. Every alias AND the canonical name
# resolve to the canonical label (case-insensitive). Companies with no entry are
# unaffected. Combined with title normalization, this suppresses URL-new
# duplicates caused by requisition URL changes and per-location title splits
# ("Engineer (Berlin)" vs "Engineer"). It does not classify repost patterns or
# produce `postingChurn` evidence; detect-reposts.mjs and company-history.mjs own
# that post-tracking layer.
#
# company_aliases:
#   Fin: [Intercom]

tracked_companies:

  # Remote / remote-first aggregators only (+ SAP careers).
  # Do NOT add random company ATS boards unless the user asks.

  - name: Himalayas
    careers_url: https://himalayas.app/jobs
    scan_method: local_parser
    parser:
      command: node
      script: local/parsers/himalayas-paged.mjs
      args: ["40"]
      format: jobs-json-v1
    enabled: true
    notes: "Local parser: pages the newest 40 pages (800 jobs); the upstream provider reads only 20 of ~96,000."

  - name: 4 Day Week
    provider: 4dayweek
    max_pages: 3
    enabled: true

  - name: RemoteOK
    careers_url: https://remoteok.com
    scan_method: local_parser
    parser:
      command: node
      script: local/parsers/dated-feeds.mjs
      args: ["remoteok"]
      format: jobs-json-v1
    enabled: true
    notes: "Local parser: adds the posting date the upstream provider drops, so the 45-day filter works."

  - name: Remotive
    careers_url: https://remotive.com
    scan_method: local_parser
    parser:
      command: node
      script: local/parsers/dated-feeds.mjs
      args: ["remotive"]
      format: jobs-json-v1
    enabled: true
    notes: "Local parser: adds the posting date the upstream provider drops."

  - name: NoDesk
    provider: nodesk
    enabled: false
    notes: "Off 2026-09-26: RSS carries only 10 items, no locations, 0 title matches."

  - name: We Work Remotely
    provider: weworkremotely
    enabled: true

  - name: Working Nomads
    careers_url: https://www.workingnomads.com
    scan_method: local_parser
    parser:
      command: node
      script: local/parsers/dated-feeds.mjs
      args: ["workingnomads"]
      format: jobs-json-v1
    enabled: true
    notes: "Local parser: adds the posting date the upstream provider drops."

  - name: Jobicy
    provider: jobicy
    enabled: true

  - name: EchoJobs
    provider: echojobs
    max_pages: 3
    enabled: false
    notes: "Often HTTP 403 — disabled to keep scans clean."

  - name: Jobspresso
    provider: jobspresso
    enabled: false
    notes: "Off 2026-09-26: 10 items, mostly older than 45 days."

  - name: The Muse
    provider: themuse
    enabled: false
    notes: "Off 2026-09-26: reads 2,000 of 414,149 jobs in ~134 s, 64% older than 45 days (up to 618), no dates, category filter ignored."

  - name: JustRemote
    provider: justremote
    enabled: true

  # ── Startup directory boards (lane D — see docs §3.6) ───────────────
  - name: a16z Speedrun Talent
    careers_url: https://speedrun-talent-network.com
    provider: a16z-speedrun-talent
    # 50 jobs per page, per query. Queries are title_filter.positive plus
    # config/profile.yml target_roles — not a hardcoded phrase. Each query
    # stops at the feed's own total_pages. "Software Engineer" alone is ~51
    # pages (2026-10-17); this budget is headroom for that one title.
    max_pages: 80
    enabled: true
    # Checked 2026-09-27: the API isn't sorted by date at all (page 1 mixed 2020/2024/2026
    # postings; a `sort=recent` param has no effect), so `postedAt` on a short sample
    # has no relationship to what's actually new. A 24-48h freshness cutoff would
    # reject almost everything essentially at random, not by staleness.
    # Title/location filtering still applies; only the age cutoff is skipped for this source.
    posting_age_filter: false
    notes: "a16z / Speedrun portfolio startups. No q: here on purpose — the provider searches each title_filter.positive phrase and each profile target role separately. One joined OR query returns 0 (checked 2026-09-26). Set q: only to override that list with a single phrase."

  - name: Hacker News Who is Hiring
    careers_url: https://news.ycombinator.com/submitted?id=whoishiring
    scan_method: local_parser
    parser:
      command: node
      script: local/parsers/hackernews-fixed.mjs
      format: jobs-json-v1
    enabled: true
    # The thread is monthly, not a rolling feed: a listing posted on day 2 is just as valid to
    # apply to on day 27 as one posted yesterday — nothing "expires" mid-thread the way a job
    # board posting does. postedAt here is really "when this comment was added", so the global
    # 24-48h window would drop most of a perfectly live thread. 720h (30d) instead spans one
    # thread's life: it naturally rolls off once the next month's thread supersedes this one.
    posting_age_hours: 720
    notes: "Local parser: each posting gets its own URL (upstream gave 34 postings the same thread URL, so 33 were dropped as duplicates) and a real location."

  - name: Top Startups
    careers_url: https://topstartups.io/jobs/?job_location=Remote
    provider: topstartups
    job_location: Remote
    roles:
      - Software Engineer
      - Backend Engineer
      - Full Stack Engineer
      - Machine Learning Engineer
    max_pages: 2
    enabled: true
    notes: "Funded-startup remote board (topstartups.io). Weekly/on-demand — see docs §3.6."

  - name: Remote.co
    provider: remoteco
    enabled: false
    notes: "Often HTTP 403 / WAF — disabled to keep scans clean."

  - name: Hubstaff Talent
    provider: hubstaff-talent
    enabled: false
    keywords:
      - software engineer
      - full stack
      - backend
      - ai engineer
      - sap
    notes: "Freelance/contract — enable only if freelancing (Perplexity #31)."

  # Peerlist + Wellfound: use india-scan Playwright (+ search_queries backup), not HTTP providers.

  # -- SAP careers (SuccessFactors) --
  - name: SAP
    careers_url: https://jobs.sap.com/
    provider: successfactors
    api: https://jobs.sap.com
    # Side lane: SF tiles often exceed the upstream 10s HTTP timeout from India
    # ("This operation was aborted") → false "broken" on /portals + silent drop
    # from npm run scan. Scan via: node local/scan-career.mjs --company SAP
    notes: "BLOCKED 2026-09-27: jobs.sap.com now answers every scripted request (even plain curl) with a Cloudflare 'Just a moment...' bot challenge (HTTP 403), so no scanner can read it. Not worked around on purpose. Find SAP roles on Naukri / LinkedIn (india-scan) or browse jobs.sap.com yourself. Historic note: SAP Labs + global SAP openings via SuccessFactors RMK; local/scan-career.mjs (30s timeout) worked on 2026-08-08."
    enabled: false

  # -- Advance Auto Parts (Phenom; Workday apply backend) --
  # Category page: https://jobs.advanceautoparts.com/us/en/c/it-jobs
  - name: Advance Auto Parts
    careers_url: https://jobs.advanceautoparts.com/us/en/
    provider: phenom
    max_pages: 2
    phenom:
      lang: en_us
      country: us
      urlPrefix: us/en
      selectedFields:
        category: ["IT"]
    notes: "Phenom widgets API. Category facet IT (~6 roles). Apply may land on Workday. Off 2026-09-26: retail company, 0 title matches for your roles."
